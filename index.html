<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页 | Portfolio</title>
    <!-- 引入现代无衬线字体 -->
    <!-- <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet"> -->
    <style>
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f1016; /* 深色背景 */
            overflow: hidden; /* 隐藏超出屏幕的背景元素 */
            position: relative;
            color: #ffffff;
        }

        /* 动态背景光球 (用于衬托毛玻璃效果) */
        .color-shape {
            position: absolute;
            filter: blur(90px);
            z-index: -1;
            opacity: 0.8;
            border-radius: 50%;
            animation: float 8s infinite alternate ease-in-out;
        }

        .shape1 {
            width: 400px;
            height: 400px;
            background: linear-gradient(to right, #ff00cc, #333399);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .shape2 {
            width: 350px;
            height: 350px;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            bottom: -150px;
            right: -50px;
            animation-delay: -4s;
        }

        .shape3 {
            width: 300px;
            height: 300px;
            background: linear-gradient(to right, #f12711, #f5af19);
            bottom: 20%;
            left: 20%;
            animation-duration: 12s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        /* 毛玻璃卡片核心样式 */
        .glass-card {
            background: rgba(255, 255, 255, 0.05); /* 半透明白色背景 */
            backdrop-filter: blur(20px); /* 核心模糊效果 */
            -webkit-backdrop-filter: blur(20px); /* Safari 兼容 */
            border: 1px solid rgba(255, 255, 255, 0.15); /* 高光边框 */
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2); /* 悬浮阴影 */
            border-radius: 24px;
            padding: 50px 40px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            z-index: 10;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3);
        }

        /* 头像样式 */
        .avatar-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 4px; /* 为头像外圈留白 */
            background: linear-gradient(45deg, #00c6ff, #ff00cc);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #1a1a1a;
        }

        /* 文本排版 */
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 20px;
            font-weight: 300;
        }

        /* 渐变文本高亮 */
        .highlight {
            background: linear-gradient(to right, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 600;
        }

        p.bio {
            font-size: 14px;
            color: #e0e0e0;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* 技能标签 / 兴趣标签 */
        .tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            cursor: default;
        }

        .tag:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        /* 社交/交互按钮 */
        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            text-decoration: none;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff00cc, #333399);
            box-shadow: 0 4px 15px rgba(255, 0, 204, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(255, 0, 204, 0.5);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- 动态背景光球 -->
    <div class="color-shape shape1"></div>
    <div class="color-shape shape2"></div>
    <div class="color-shape shape3"></div>

    <!-- 毛玻璃主卡片 -->
    <div class="glass-card">
        <!-- 头像区 -->
        <div class="avatar-container">
            <!-- 这里可以替换成你真实的头像图片链接 -->
            <img src="https://q1.qlogo.cn/g?b=qq&nk=1339718850&s=640" alt="Avatar" class="avatar">
        </div>

        <!-- 个人信息区 -->
        <h1>你好，我是 <span class="highlight">gcq</span></h1>
        <div class="subtitle">数字游民 / 全栈开发者 / AI </div>
        
        <p class="bio">
            热爱探索前沿科技与美学设计的结合。目前致力于构建富有交互性、现代感的 Web 体验。保持年轻，保持好奇。
        </p>

        <!-- 标签区 -->
        <div class="tags">
            <span class="tag">UI/UX 设计</span>
            <span class="tag">前端开发</span>
            <span class="tag">摄影</span>
            <span class="tag">Python</span>
            <span class="tag">AI 绘画</span>
        </div>

        <!-- 按钮区 -->
        <div class="actions">
            <a href="blog.gcqweb.cn" class="btn btn-primary">了解作品</a>
            <a href="gcqweb.cn" class="btn btn-secondary">联系我</a>
        </div>
    </div>

</body>
</html>
